<rect width="1800" height="1540" fill="white"/>
<text x="50" y="48" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" text-anchor="start" fill="#183247">03 · Components — Board Web Application</text>
<text x="50" y="87" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#183247">C4 Level 3 | Expands: Board Web Application [Python / Django container]</text>
<rect x="60" y="320" width="1680" height="835" rx="12" fill="#f5faff" stroke="#42799e" stroke-width="2"/>
<text x="85" y="355" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#183247">BOARD WEB APPLICATION · ALL COMPONENTS ARE PYTHON MODULES IN ONE PROCESS</text>
<rect x="100" y="125" width="380" height="145" rx="12" fill="#edf0f3" stroke="#42799e" stroke-width="2"/>
<text x="290.0" y="155" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Campus Identity</text>
<text x="290.0" y="183" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[External software system]</text>
<text x="290.0" y="214" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Verifies university credential.</text>
<rect x="710" y="125" width="380" height="145" rx="12" fill="#edf0f3" stroke="#42799e" stroke-width="2"/>
<text x="900.0" y="155" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">University Student</text>
<text x="900.0" y="183" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Person / web browser]</text>
<text x="900.0" y="214" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Requests pages and actions.</text>
<rect x="100" y="405" width="380" height="170" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="290.0" y="435" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Identity Gateway</text>
<text x="290.0" y="463" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Python / HTTPS client]</text>
<text x="290.0" y="494" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">verify(credential) / require(session)</text>
<text x="290.0" y="519" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Creates trusted VerifiedStudent.</text>
<text x="290.0" y="544" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Rejects invalid identity.</text>
<rect x="710" y="405" width="380" height="170" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="900.0" y="435" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Web Controller</text>
<text x="900.0" y="463" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Django views]</text>
<text x="900.0" y="494" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Authenticate every board request.</text>
<text x="900.0" y="519" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Render pages; dispatch actions.</text>
<text x="900.0" y="544" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Use trusted student ID only.</text>
<rect x="1320" y="685" width="380" height="205" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="1510.0" y="715" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Workshop Service</text>
<text x="1510.0" y="743" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Python]</text>
<text x="1510.0" y="774" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Create: unique ID; title not empty.</text>
<text x="1510.0" y="799" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Require start; capacity 1–20.</text>
<text x="1510.0" y="824" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Creator owns; owner-only publish/list.</text>
<text x="1510.0" y="849" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Published board + own booking.</text>
<rect x="710" y="685" width="380" height="180" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="900.0" y="715" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Reservation Service</text>
<text x="900.0" y="743" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Python]</text>
<text x="900.0" y="774" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Apply reservation rules atomically.</text>
<text x="900.0" y="799" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Existing seat before capacity check.</text>
<text x="900.0" y="824" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Commit seat before asking for mail.</text>
<rect x="100" y="685" width="380" height="180" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="290.0" y="715" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Mail Gateway</text>
<text x="290.0" y="743" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Python / HTTPS client]</text>
<text x="290.0" y="774" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">requestConfirmation(reservation,</text>
<text x="290.0" y="799" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">workshop) → Accepted / Unavailable</text>
<text x="290.0" y="824" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Timeout = unavailable; no retry.</text>
<rect x="100" y="1220" width="380" height="160" rx="12" fill="#edf0f3" stroke="#42799e" stroke-width="2"/>
<text x="290.0" y="1250" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">University Mail</text>
<text x="290.0" y="1278" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[External software system]</text>
<text x="290.0" y="1309" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Accepts confirmation requests.</text>
<rect x="1090" y="960" width="540" height="170" rx="12" fill="#dceefa" stroke="#42799e" stroke-width="2"/>
<text x="1360.0" y="990" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Board Repository</text>
<text x="1360.0" y="1018" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Component: Django ORM / SQL]</text>
<text x="1360.0" y="1049" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Durable workshop and reservation access.</text>
<text x="1360.0" y="1074" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Unit of work; lock workshop through commit.</text>
<text x="1360.0" y="1099" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Atomic board reads; unique reservation key.</text>
<rect x="1090" y="1230" width="540" height="175" rx="12" fill="#e1f2e8" stroke="#42799e" stroke-width="2"/>
<text x="1360.0" y="1260" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183247">Board Database</text>
<text x="1360.0" y="1288" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#183247">[Container: PostgreSQL]</text>
<text x="1360.0" y="1319" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Workshops, owners, reservations and contact data.</text>
<text x="1360.0" y="1344" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#183247">Constraints + durable transactions + row locks.</text>
