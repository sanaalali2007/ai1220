<polygon points="290,1220 285.3269798922962,1208.9472680719655 294.6730201077038,1208.9472680719655" fill="#183247"/>
<rect x="398.8671875" y="991" width="222.265625" height="72" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="510" y="1010" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#183247">HTTPS / JSON: recipient,</text>
<text x="510" y="1033" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#183247">reservation and workshop</text>
<text x="510" y="1056" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#183247">→ Accepted / Unavailable</text>
<polyline points="970,865 970,1045 1090,1045" fill="none" stroke="#183247" stroke-width="2"/>
<polygon points="1090,1045 1078.9472680719655,1049.673020107704 1078.9472680719655,1040.326979892296" fill="#183247"/>
<rect x="645.703125" y="917" width="308.59375" height="71" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="800" y="935" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">In-process unitOfWork:</text>
<text x="800" y="958" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">lock + findOwn + count + insert</text>
<text x="800" y="981" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">→ stored / existing reservation; commit</text>
<polyline points="1510,890 1510,960" fill="none" stroke="#183247" stroke-width="2"/>
<polygon points="1510,960 1505.326979892296,948.9472680719654 1514.673020107704,948.9472680719654" fill="#183247"/>
<rect x="1160.09375" y="887" width="279.8125" height="48" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="1300" y="905" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">In-process: save / publish / query</text>
<text x="1300" y="928" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">→ workshop / summaries / contacts</text>
<polyline points="1360,1130 1360,1230" fill="none" stroke="#183247" stroke-width="2"/>
<polygon points="1360,1230 1355.326979892296,1218.9472680719655 1364.673020107704,1218.9472680719655" fill="#183247"/>
<rect x="1410.8671875" y="1154" width="238.265625" height="48" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="1530" y="1172" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">SQL over PostgreSQL protocol</text>
<text x="1530" y="1195" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">Rows / commit / error</text>
<text x="70" y="1460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#183247">Legend: blue = component; green = data store; grey = external / supporting element. Boundary = named parent container.</text>
<text x="70" y="1487" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#183247">All internal interfaces use in-process Python calls and typed values; only gateways and repository cross process boundaries.</text>
