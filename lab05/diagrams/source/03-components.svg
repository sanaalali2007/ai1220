<rect x="487.6171875" y="672" width="214.765625" height="71" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="595" y="690" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">requestConfirmation</text>
<text x="595" y="713" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">New reservation + contact</text>
<text x="595" y="736" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">→ Accepted / Unavailable</text>
