<polygon points="900,685 895.3269798922962,673.9472680719654 904.6730201077038,673.9472680719654" fill="#183247"/>
<rect x="901.109375" y="602" width="293.78125" height="48" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="1048" y="620" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">reserve(VerifiedStudent, workshopId)</text>
<text x="1048" y="643" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">→ ReservationResult</text>
<polyline points="1090,520 1510,520 1510,685" fill="none" stroke="#183247" stroke-width="2"/>
<polygon points="1510,685 1505.326979892296,673.9472680719654 1514.673020107704,673.9472680719654" fill="#183247"/>
<rect x="1175.46875" y="547" width="369.0625" height="71" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="1360" y="565" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">create / publish / browse / attendees</text>
<text x="1360" y="588" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">Trusted student + details / workshopId</text>
<text x="1360" y="611" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#183247">→ Workshop / summaries / owner-only contacts</text>
